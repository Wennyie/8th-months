<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Gift 🎁💗</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('monthsaryTheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
#heart{display:grid;grid-template-columns:repeat(13,1fr);width:min(94vw,640px);gap:0;border:0;filter:drop-shadow(0 8px 0 rgba(201,24,74,.25))}
.c{aspect-ratio:1;position:relative;overflow:hidden;background:var(--pink);box-shadow:inset 0 0 0 2px var(--brown);opacity:0;transform:scale(.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.c.e{visibility:hidden;pointer-events:none}
.c.in{animation:pop .35s forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.c:hover{z-index:2;transform:scale(1.15)!important;box-shadow:inset 0 0 0 2px var(--brown),0 0 0 3px var(--deep)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;width:100%}
.vcard{padding:12px;text-align:center}
.vthumb{position:relative;border:4px solid var(--brown);background:#2b1e3a;aspect-ratio:16/10;overflow:hidden;margin-bottom:12px}
.vthumb video{width:100%;height:100%;object-fit:cover;image-rendering:auto}
.vthumb .miss{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;line-height:1.8;padding:10px}
.vplay{display:block;width:100%}
#lb,#vm{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:12px}
#lb.on,#vm.on{display:flex}
#lb img{max-width:100%;max-height:88vh;border:4px solid var(--brown);box-shadow:4px 4px 0 var(--dpink);image-rendering:auto}
#vm .box{padding:14px;max-width:760px;width:100%;text-align:center}
#vm video{width:100%;max-height:70vh;background:#000;display:block;margin-bottom:12px;image-rendering:auto}
</style>
</head>
<body>
<div id="loader" role="status" aria-label="Loading"><div class="lcake"><i class="lp"></i><i class="l1"></i><i class="l2"></i><i class="cd c1"></i><i class="cd c2"></i><i class="cd c3"></i><b class="fw c1"></b><b class="fw c2"></b><b class="fw c3"></b><b class="sk c1"></b><b class="sk c2"></b><b class="sk c3"></b></div><div id="lText">Baking something sweet...</div><div class="lbar"><div id="lFill"></div></div><div id="lPct">0%</div></div>
<canvas id="bg"></canvas>
<main>
<a class="btn" href="story.html" style="margin-top:8px">← BACK TO OUR STORY</a>

<section class="center" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px">
  <div class="box" style="padding:18px;max-width:560px">
    <h1 style="font-size:15px;margin-bottom:8px">🎁 MY GIFT 🎁</h1>
    <p class="vt" style="font-size:24px">"Every little square is a piece of us. Together, they make my whole heart."</p>
  </div>
  <div id="heart" role="img" aria-label="A big pixel heart made of our photos"></div>
  <span class="tip blink">✦ CLICK A SQUARE TO SEE THE PHOTO ✦</span>
</section>

<section class="center" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:20px">
  <div class="box" style="padding:18px;max-width:560px">
    <h2 style="font-size:14px;margin-bottom:8px">Videos Gift 🎬</h2>
    <p class="vt" style="font-size:24px">"Press play, my Sayang."</p>
  </div>
  <div class="vgrid" id="vgrid"></div>
</section>
<footer class="vt center" style="font-size:20px;opacity:.75">I love you, my Sayang. Happy 8th Monthsary my Sayang! ♡</footer>
</main>

<div id="lb" onclick="this.classList.remove('on')"><img id="lbImg" alt="Our photo"></div>
<div id="vm" onclick="if(event.target===this)closeVideo()">
  <div class="box">
    <h3 id="vmTitle" style="color:var(--deep);margin-bottom:10px;line-height:1.6;font-size:12px"></h3>
    <video id="vmVid" controls playsinline></video>
    <button class="btn" onclick="closeVideo()">♡ CLOSE ♡</button>
  </div>
</div>

<script src="common.js"></script>
<script>
/* ===== EDIT HERE ===== */
const PHOTOS = [
  'photos/photo1.jpeg',
  'photos/photo2.jpeg',
  'photos/photo3.jpeg',
  'photos/photo4.jpeg',
  'photos/photo5.jpeg',
  'photos/photo6.jpeg',
  'photos/photo7.jpeg',
  'photos/photo8.jpeg',
  'photos/photo9.jpeg',
  'photos/photo10.jpeg',
  'photos/photo11.jpeg',
  'photos/photo12.jpeg',
  'photos/photo13.jpeg',
  'photos/photo14.jpeg',
  'photos/photo15.jpeg',
  'photos/photo16.jpeg',
  'photos/photo17.jpeg',
  'photos/photo18.jpeg',
  'photos/photo19.jpeg',
  'photos/photo20.jpeg',
  'photos/photo21.jpeg',
  'photos/photo22.jpeg',
  'photos/photo23.jpeg',
  'photos/photo24.jpeg',
  'photos/photo25.jpeg'
];
const VIDEOS=[
 {title:'Our Video 1 💗',file:'videos/video1.mp4'},
 {title:'Our Video 2 🌷',file:'videos/video2.mp4'},
 {title:'Our Video 3 ✨',file:'videos/video3.mp4'}];

/* ===== pixel heart: 1 = a photo square ===== */
const MASK=['0011100011100','0111110111110','1111111111111','1111111111111','1111111111111','0111111111110','0011111111100','0001111111000','0000111110000','0000011100000','0000001000000'];
const heart=document.getElementById('heart');
let n=0;const cells=[];
MASK.forEach((row,r)=>[...row].forEach((v,col)=>{
  const d=document.createElement('div');d.className='c';
  if(v==='1'){
    const src=PHOTOS[n%PHOTOS.length];n++;
    d.textContent='💗';d.dataset.src=src;
    const img=new Image();img.alt='';img.onload=()=>{d.textContent='';d.appendChild(img)};img.src=src;
    d.onclick=()=>{if(d.querySelector('img')){lbImg.src=src;lb.classList.add('on');chime()}};
    cells.push(d);
  }else d.className='c e';
  heart.appendChild(d);
}));
/* one reveal: squares pop in from the top row down */
cells.forEach((d,i)=>setTimeout(()=>d.classList.add('in'),i*45+200));
setTimeout(()=>{chime();burst(20,70)},cells.length*45+300);
/* the hidden spacer squares need no animation */

/* ===== videos ===== */
const vgrid=document.getElementById('vgrid');
VIDEOS.forEach((v,i)=>{
  const d=document.createElement('div');d.className='box vcard';
  d.innerHTML=`<div class="vthumb"><video preload="metadata" muted playsinline src="${v.file}#t=0.5"></video><div class="miss hidden">Add ${v.file}</div></div><div style="color:var(--deep);margin-bottom:12px;line-height:1.6">${v.title}</div><button class="btn vplay">▶ PLAY VIDEO</button>`;
  const th=d.querySelector('video'),miss=d.querySelector('.miss');
  th.addEventListener('error',()=>miss.classList.remove('hidden'));
  d.querySelector('.vplay').onclick=()=>openVideo(v);
  vgrid.appendChild(d);
});
function openVideo(v){Music.pause();vmTitle.textContent=v.title;vmVid.src=v.file;vm.classList.add('on');vmVid.play().catch(()=>{});chime()}
function closeVideo(){vmVid.pause();vmVid.removeAttribute('src');vmVid.load();vm.classList.remove('on');Music.resume()}
addEventListener('keydown',e=>{if(e.key==='Escape'){lb.classList.remove('on');if(vm.classList.contains('on'))closeVideo()}});
</script>
</body>
</html>

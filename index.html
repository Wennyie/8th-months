<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 8th Monthsary, My Sayang! 🎂💗</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('monthsaryTheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader" role="status" aria-label="Loading"><div class="lcake"><i class="lp"></i><i class="l1"></i><i class="l2"></i><i class="cd c1"></i><i class="cd c2"></i><i class="cd c3"></i><b class="fw c1"></b><b class="fw c2"></b><b class="fw c3"></b><b class="sk c1"></b><b class="sk c2"></b><b class="sk c3"></b></div><div id="lText">Baking something sweet...</div><div class="lbar"><div id="lFill"></div></div><div id="lPct">0%</div></div>
<canvas id="bg"></canvas>
<main>
<section class="hero center">
  <div class="float" style="font-size:24px;color:var(--deep)">૮ ˶ᵔ ᵕ ᵔ˶ ა</div>
  <div class="box banner">
    <h1 style="font-size:15px">HAPPY 8th MONTHSARY</h1>
    <div class="tag">✨ MY SAYANG ✨</div>
    <p class="vt" style="font-size:24px;line-height:1.2">"Eight months with you, and I would choose you all over again. ♡"</p>
  </div>
  <div id="cakeWrap" style="width:min(100%,780px)" onclick="blowCandles()">
    <canvas id="cake" width="768" height="691"></canvas>
    <div id="tip" class="tip blink">✦ CLICK THE CAKE TO MAKE A WISH ✦</div>
  </div>
  <div id="wish" class="hidden bob">
    <p style="margin-bottom:10px">🎉 Wish granted! ♡ 🎉</p>
    <p class="vt" style="font-size:24px;color:var(--deep);margin-bottom:14px">Come read our little story...</p>
    <a class="btn" href="story.html">OUR LITTLE STORY ♡</a>
    <button class="btn" onclick="resetCake()" style="margin-top:10px">🎂 REPLAY WISH</button>
  </div>
</section>
</main>
<script src="common.js"></script>
<script>
const cv=document.getElementById('cake'),c=cv.getContext('2d');
const S=2.4;                        /* cake scale: bigger cake (was 1.75, originally 1) */
const LW=cv.width/S,LH=cv.height/S; /* logical drawing size */
const POS=[-45,-32,-19,-6,7,20,33,46];
let flames=POS.map(()=>false),sparks=[],smoke=[],bounce=0,windX=-50,wind=false,blown=false;

function frame(){
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.scale(S,S);
  const cx=LW/2,by=LH-70-bounce;
  c.fillStyle='rgba(82,61,53,.15)';c.beginPath();c.ellipse(cx,by+28,95,14,0,0,7);c.fill();
  rect(c,cx-95,by+12,190,8,'#e8dff5');rect(c,cx-85,by+20,170,6,'#d4c2fc');
  rect(c,cx-75,by-40,150,52,PINK);rect(c,cx-75,by-20,150,12,DPINK);
  for(let i=-75;i<75;i+=15)rect(c,cx+i,by-40,8,12,'#fff');
  rect(c,cx-55,by-90,110,50,'#fff');rect(c,cx-55,by-70,110,8,'#ffe5ec');
  for(let i=-55;i<55;i+=12)rect(c,cx+i,by-90,6,10,PINK);
  [-40,-20,0,20,40].forEach((o,i)=>{if(i%2==0){rect(c,cx+o-4,by-98,8,8,'#ff4d6d');rect(c,cx+o-2,by-100,4,2,'#70e000')}else rect(c,cx+o-3,by-96,6,6,DPINK)});
  c.textAlign='center';c.font='8px "Press Start 2P"';
  c.fillStyle=DEEP;c.fillText('HAPPY 8TH',cx,by-76);
  rect(c,cx-50,by-12,100,16,DPINK);c.strokeStyle=BROWN;c.lineWidth=2;c.strokeRect(cx-50,by-12,100,16);
  c.fillStyle='#fff';c.fillText('MY SAYANG',cx,by,95);
  POS.forEach((p,i)=>{const x=cx+p,y=by-106;
    rect(c,x-2,y,5,16,'#ffe5ec');rect(c,x-2,y+4,5,3,DPINK);rect(c,x-2,y+10,5,3,DPINK);rect(c,x,y-3,1,3,BROWN);
    if(flames[i]){
      const t=performance.now()/1000,sw=Math.sin(t*6+i*1.3)*1.3,fh=7+Math.sin(t*9+i*2.1)*1.6+Math.random()*.8;
      c.fillStyle='rgba(255,210,90,'+(.16+Math.sin(t*5+i)*.04)+')';c.beginPath();c.arc(x+.5,y-7,12+Math.sin(t*4+i)*1.5,0,7);c.fill();
      rect(c,x-2+sw*.4,y-3-fh,5,fh,'#ff9e00');rect(c,x-1+sw*.7,y-3-fh+2,3,fh-3,'#ffd23f');rect(c,x-.5+sw*.9,y-7,2,3,'#fff');
      if(Math.random()<.02)sparks.push({x:x+sw,y:y-3-fh,vy:Math.random()*.5+.3,a:1})}});
  for(let i=sparks.length-1;i>=0;i--){const q=sparks[i];rect(c,q.x,q.y,1.5,1.5,'rgba(255,200,60,'+q.a+')');q.y-=q.vy;q.x+=Math.sin(q.y)*.3;q.a-=.03;if(q.a<=0)sparks.splice(i,1)}
  if(wind){rect(c,windX,by-110,30,4,'rgba(255,255,255,.8)');rect(c,windX-15,by-116,25,3,'rgba(255,255,255,.6)');windX+=10;if(windX>LW+50)wind=false}
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];rect(c,p.x,p.y,p.s,p.s,`rgba(180,180,180,${p.a})`);p.y-=p.v;p.x+=Math.sin(p.y*.1);p.a-=.015;if(p.a<=0)smoke.splice(i,1)}
  if(bounce>0)bounce-=.5;
  requestAnimationFrame(frame)
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{frame();lightUp()});
/* candles light up one by one */
function lightUp(){POS.forEach((_,i)=>setTimeout(()=>{if(blown)return;flames[i]=true;tone(660+i*60,.12,'triangle',.03)},600+i*220))}

function blowCandles(){
  if(blown)return;blown=true;Music.play();bounce=12;windX=0;wind=true;blowSound();
  flames.forEach((_,i)=>setTimeout(()=>{
    flames[i]=false;const x=LW/2+POS[i],y=LH-70-106;
    for(let s=0;s<5;s++)smoke.push({x:x+(Math.random()-.5)*6,y:y-5,s:Math.random()*4+2,v:Math.random()*.8+.4,a:.8});
    tone(400-i*30,.1,'square',.03)},i*150));
  setTimeout(()=>{chime();document.getElementById('tip').classList.add('hidden');document.getElementById('wish').classList.remove('hidden');burst(25,60)},1400)
}
function resetCake(){flames=POS.map(()=>false);blown=false;lightUp();document.getElementById('wish').classList.add('hidden');document.getElementById('tip').classList.remove('hidden')}
</script>
</body>
</html>
